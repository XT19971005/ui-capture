<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>拾界</title><link rel="icon" href="favicon.ico?v=20261013-purple" type="image/x-icon"><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="url-capture.css"><link rel="stylesheet" href="studio.css"></head><body><header class="popup-header"><a class="brand" href="#"><img class="shijie-mark" src="icons/shijie.svg" alt="拾界图标"><span>拾界<small>UI CAPTURE</small></span></a><span class="version">0.9.0</span></header><main><div class="popup-mode" role="tablist" aria-label="工作模式"><button role="tab" id="popup-tab-web" data-popup-mode="web" aria-selected="true" aria-controls="popup-web">网页编辑</button><button role="tab" id="popup-tab-image" data-popup-mode="image" aria-selected="false" aria-controls="popup-image" tabindex="-1">图片拆分</button></div><section id="popup-web" role="tabpanel" aria-labelledby="popup-tab-web" class="capture-card"><h1>抓取网页</h1><label class="url-capture"><input id="page-url" type="text" placeholder="输入网址，留空抓取当前页" spellcheck="false" autocomplete="off" aria-label="要抓取的网址"></label><div class="capture-settings"><div class="scope-buttons" role="group" aria-label="抓取范围"><button data-scope="viewport" aria-pressed="true">当前屏幕</button><button data-scope="page" aria-pressed="false">整页</button><button data-scope="region" aria-pressed="false">框选</button></div><input id="scope" type="hidden" value="viewport"><label class="capture-option"><span>包含网页图片</span><input id="images" type="checkbox" checked><span class="switch" aria-hidden="true"></span></label></div><button id="capture" class="primary capture-action"><span>抓取当前屏幕</span><span>↗</span></button></section><section id="popup-image" role="tabpanel" aria-labelledby="popup-tab-image" class="capture-card" hidden><h1>图片拆成图层</h1><div class="popup-image-art" aria-hidden="true"><span>▧</span><span>→</span><div><b>T <i>文字</i></b><b>◇ <i>形状</i></b><b>▧ <i>图片</i></b></div></div><button id="image-workbench" class="primary capture-action">选择图片并开始</button></section><div class="popup-projects"><button id="workbench">继续编辑</button><button id="popup-library">工程库</button></div><progress id="progress" hidden max="1" value="0"></progress><div id="status" role="status" aria-live="polite"></div><details><summary>本地 HTML 无法抓取？</summary><p>扩展详情 → 开启「允许访问文件 URL」。</p></details></main><footer><span class="privacy-dot"></span> 本机处理 <span>Designed by <b>XT</b></span></footer><script src="popup.js"></script></body></html>
