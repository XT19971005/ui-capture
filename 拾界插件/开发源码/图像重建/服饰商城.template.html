function sheet(title,html){$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0}
$('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
function openProduct(p){sheet('PRODUCT DETAILS','<div id="detail-image" class="detail-photo"></div><div class="detail-brand">'+escapeHTML(state.edits['brand-'+p.id]??p.brand)+'</div><h3 class="detail-title">'+escapeHTML(p.title)+'</h3><div class="detail-price">'+escapeHTML(priceText(p))+'</div><p class="muted">款式名称为演示描述。'+(p.partial?'原图部分内容被遮挡，价格未显示。':'价格与照片来自你提供的参考图。')+'</p><button id="add-to-bag" class="solid">ADD TO BAG</button>');$('#detail-image').append(photo(p));$('#add-to-bag').onclick=()=>{const item=state.bag.find(x=>x.id===p.id);if(item){if(item.qty<99)item.qty++}else state.bag.push({id:p.id,qty:1});persist();updateBagCount();dialog.close();toast('已加入购物袋')}}
function openBag(){sheet('SHOPPING BAG','<div id="bag-list"></div>');const list=$('#bag-list');if(!state.bag.length){list.innerHTML='<p>Your bag is empty.</p><p class="muted">选一件商品试试。购物袋只保存在本机。</p><button id="continue-shopping" class="solid">CONTINUE SHOPPING</button>';$('#continue-shopping').onclick=()=>dialog.close();return}let total=0,unknown=false;state.bag.forEach(item=>{const p=products.find(p=>p.id===item.id),cost=price(p);if(cost===null)unknown=true;else total+=cost*item.qty;const row=document.createElement('div');row.className='bag-item';row.innerHTML='<div class="bag-thumb"></div><div><p>'+escapeHTML(state.edits['brand-'+p.id]??p.brand)+'</p><p class="muted">'+escapeHTML(p.title)+'</p><p>'+escapeHTML(priceText(p))+'</p><div class="qty-controls"><button data-qty="-1" aria-label="减少 '+escapeHTML(p.title)+'">−</button><span>'+item.qty+'</span><button data-qty="1" aria-label="增加 '+escapeHTML(p.title)+'" '+(item.qty>=99?'disabled':'')+'>+</button></div></div><button class="remove-item" aria-label="移除 '+escapeHTML(p.title)+'">移除</button>';$('.bag-thumb',row).append(photo(p));$$('[data-qty]',row).forEach(b=>b.onclick=()=>{item.qty+=Number(b.dataset.qty);if(item.qty<=0)state.bag=state.bag.filter(i=>i!==item);persist();updateBagCount();openBag()});$('.remove-item',row).onclick=()=>{state.bag=state.bag.filter(i=>i!==item);persist();updateBagCount();openBag()};list.append(row)});const foot=document.createElement('div');foot.innerHTML='<div class="bag-total"><span>'+(unknown?'KNOWN SUBTOTAL':'SUBTOTAL')+'</span><span>$'+total.toLocaleString('en-US')+'</span></div><p class="muted">'+(unknown?'另有原图未标价商品。':'')+'本地界面演示，不产生实际订单。</p><button id="continue-shopping" class="solid">CONTINUE SHOPPING</button>';list.append(foot);$('#continue-shopping').onclick=()=>dialog.close()}
$('#bag-open').onclick=()=>{if(!state.editing)openBag()};
$('#search-open').onclick=()=>{if(state.editing)return;sheet('SEARCH','<form id="search-form"><input class="field" id="search-input" type="search" aria-label="搜索商品" placeholder="Designer, item or color" autocomplete="off"><p class="muted">试试 Conner Ives、dress、black 或「上衣」。</p><button class="solid">VIEW RESULTS</button></form>');$('#search-input').value=state.query;$('#search-input').focus();$('#search-form').onsubmit=e=>{e.preventDefault();state.query=$('#search-input').value.trim();state.category='women';render();dialog.close();$('#scroller').scrollTop=0}};
$('#sort-open').onclick=()=>{if(state.editing)return;sheet('SORT BY','<div class="option-list">'+[['original','Original order'],['low','Price: low to high'],['high','Price: high to low']].map(([v,t])=>'<label><input name="sort" type="radio" value="'+v+'" '+(state.sort===v?'checked':'')+'>'+t+'</label>').join('')+'</div><p class="muted">未标价商品始终排在已标价商品后面。</p>');$$('input[name=sort]',dialog).forEach(r=>r.onchange=()=>{state.sort=r.value;render();dialog.close();$('#scroller').scrollTop=0})};
$('#filters-open').onclick=()=>{if(state.editing)return;let type=state.type,max=state.maxPrice;sheet('FILTERS','<div class="filter-heading">CATEGORY</div><div class="filter-tags">'+[['all','All'],['dress','Dresses'],['top','Tops'],['bottom','Bottoms']].map(([v,t])=>'<button data-type="'+v+'" aria-pressed="'+(type===v)+'">'+t+'</button>').join('')+'</div><div class="filter-heading">MAXIMUM PRICE</div><input id="price-range" class="range" aria-label="最高价格" type="range" min="200" max="1200" step="25" value="'+(max??1200)+'"><div class="price-line"><span>$200</span><span id="price-value">'+(max===null?'Any price':'$'+max)+'</span></div><p class="muted">限定价格时，不包含原图未标价的商品。</p><button class="solid" id="apply-filters">SHOW RESULTS</button><button class="outline" id="reset-sheet">RESET FILTERS</button>');$$('[data-type]',dialog).forEach(b=>b.onclick=()=>{type=b.dataset.type;$$('[data-type]',dialog).forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});$('#price-range').oninput=e=>{max=Number(e.target.value)===1200?null:Number(e.target.value);$('#price-value').textContent=max===null?'Any price':'$'+max};$('#apply-filters').onclick=()=>{state.type=type;state.maxPrice=max;state.category='women';render();dialog.close();$('#scroller').scrollTop=0};$('#reset-sheet').onclick=()=>{resetFilters();dialog.close()}};
$('#sale-only').onchange=e=>{state.sale=e.target.checked;render()};$$('[data-category]').forEach(b=>b.onclick=()=>{if(state.editing)return;state.category=b.dataset.category;render()});$('#clear-filters').onclick=resetFilters;
$('#shop-open').onclick=()=>{if(state.editing)return;resetFilters()};
$('#home-open').onclick=()=>{if(state.editing)return;sheet('THE COLLECTION','<div class="detail-brand">CONNER IVES</div><h3 class="detail-title">A closer look.</h3><p class="muted">探索参考图中的 9 件服饰。原有照片搭配可编辑文字、矢量图标与可操作的商品列表。</p><div class="mini-stat"><div><strong>09</strong><span>REFERENCE ITEMS</span></div><div><strong>03</strong><span>PRODUCT CATEGORIES</span></div></div><button class="solid" id="home-shop">EXPLORE WOMENSWEAR</button>');$('#home-shop').onclick=()=>{resetFilters();dialog.close()}};
function setEditing(value){state.editing=value;document.body.classList.toggle('editing',value);$('#edit-toggle').setAttribute('aria-pressed',String(value));$('#edit-toggle span').textContent=value?'完成编辑':'编辑文字';applyEdits();if(value)toast('点击文字即可修改；完成后可保存 HTML')}
$('#profile-open').onclick=()=>{if(state.editing){setEditing(false);return}sheet('YOUR SPACE','<h3 class="detail-title">Make it yours.</h3><p class="muted">这是本地还原页面，无需注册。文字修改和购物袋会保存在当前浏览器。</p><button id="profile-edit" class="solid">编辑页面文字</button><button id="profile-save" class="outline">保存 HTML</button><button id="profile-reset" class="outline">恢复原图文字</button>');$('#profile-edit').onclick=()=>{dialog.close();setEditing(true)};$('#profile-save').onclick=saveHTML;$('#profile-reset').onclick=()=>{state.edits={};persist();render();dialog.close();toast('已恢复原图文字')}};
$('#edit-toggle').onclick=()=>setEditing(!state.editing);
document.addEventListener('focusout',e=>{if(!e.target.matches('[data-edit]')||!state.editing)return;const text=e.target.textContent.trim().slice(0,160);state.edits[e.target.dataset.edit]=text;e.target.textContent=text;persist()});document.addEventListener('keydown',e=>{if(e.target.matches('[data-edit]')&&e.key==='Enter'){e.preventDefault();e.target.blur()}if(e.key==='Escape'&&state.editing&&!dialog.open)setEditing(false)});
let comparing=false;$('#compare-toggle').onclick=()=>{comparing=!comparing;$('#compare-toggle').setAttribute('aria-pressed',String(comparing));if(comparing){const img=document.createElement('img');img.className='reference';img.src=source;img.alt='原始参考截图';app.append(img);const label=document.createElement('button');label.className='reference-label';label.textContent='原图 · 点击返回 HTML';label.onclick=()=>$('#compare-toggle').click();app.append(label)}else $$('.reference,.reference-label').forEach(n=>n.remove())};
$$('[data-zoom]').forEach(b=>b.onclick=()=>{app.style.width=b.dataset.zoom==='large'?'min(680px, calc(100vw - 470px))':'';$$('[data-zoom]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})
function saveHTML(){if(document.activeElement?.matches('[data-edit]'))document.activeElement.blur();const copy=document.documentElement.cloneNode(true);$$('[data-generated]',copy).forEach(n=>n.replaceChildren());$$('.reference,.reference-label',copy).forEach(n=>n.remove());$('#sheet',copy).removeAttribute('open');$('#saved-state',copy).textContent=JSON.stringify({documentId:'saved-'+Date.now().toString(36),edits:state.edits,bag:state.bag}).replace(/</g,'\\u003c');$('body',copy).classList.remove('editing');$('#toast',copy).textContent='';$('#toast',copy).classList.remove('show');$('#edit-toggle',copy).setAttribute('aria-pressed','false');$('#edit-toggle span',copy).textContent='编辑文字';$$('[data-edit]',copy).forEach(n=>n.contentEditable='false');$('#compare-toggle',copy).setAttribute('aria-pressed','false');const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='服饰商城_已编辑.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已生成可独立打开的 HTML')}
$('#save-html').onclick=saveHTML;render();
</script>
</body></html>
