<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾界 · 图片拆分</title><link rel="icon" href="favicon.ico?v=20261013-purple" type="image/x-icon"><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="image-editor.css"><link rel="stylesheet" href="editor-ui.css"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="layer-style-panel.css"><link rel="stylesheet" href="workspace-ui.css"><link rel="stylesheet" href="workspace-polish.css"><style>.selected-refine-controls{padding:12px 0;border-bottom:1px solid var(--line,#333);margin-bottom:12px}.selected-refine-controls button{width:100%}.selected-refine-controls p:empty{display:none}</style></head><body>
<header class="app-header single-module"><a class="brand" href="export.html"><img class="shijie-mark" src="icons/shijie-48.png" alt=""><span>拾界<small>UI CAPTURE</small></span><span class="brand-signature" aria-label="Designed by XT">Designed by <b>XT</b></span></a><div class="header-actions"><span class="local-badge">图片拆分 · 自己的 Codex</span><button id="codex-settings">连接 Codex</button><button id="open-project">打开工程</button><button id="save-project" class="primary" disabled>保存工程</button></div></header>
<div class="workspace"><aside class="layers"><div class="panel-title">图层 <span id="layer-count" class="count">0</span></div><button id="upload" class="primary">＋ 导入图片</button><input hidden id="image-file" type="file" accept="image/png,image/jpeg,image/webp"><input hidden id="project-file" type="file" accept=".json"><p class="tip import-formats">PNG / JPG / WebP · 可拖入或粘贴</p><button id="cancel" hidden>取消处理</button><div id="recognition-summary" class="recognition-summary" hidden></div><div class="section-title">图层列表 <button id="add-text" title="添加文字" disabled>＋ 文字</button></div><input id="layer-search" type="search" placeholder="搜索图层…" aria-label="搜索图层"><div class="layer-filters"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="text">文字</button><button data-filter="vector">形状</button><button data-filter="image">图片</button></div><div id="layer-list" role="listbox" aria-label="图层列表"></div><div class="layer-actions"><button id="up" title="上移一层" disabled>上移</button><button id="down" title="下移一层" disabled>下移</button><button id="delete" disabled>删除</button></div></aside>
<main><div class="document-bar"><div><span class="document-dot"></span><strong id="document-title">图片拆分</strong><span class="doc-tag">编辑</span></div><span class="bar-hint">导入图片 → 拆分 → 校对</span><div class="document-actions"><button id="recognize" type="button" class="primary" disabled>开始拆分</button><button id="refine-ui" type="button" class="primary" disabled hidden title="精修文字、简单面板与纯色矢量，保留图片">精修文字</button><button id="repair-order" type="button" disabled title="对照原图遮挡关系，仅调整前后顺序">修复层级</button></div></div><p id="order-repair-note" class="tip" role="status" aria-live="polite" style="margin:0;padding:0 16px"></p><div class="toolbar"><div class="tools"><button data-tool="select" aria-pressed="true" title="选择 V">↖ 选择</button><button data-tool="hand" title="平移 H / 按住空格">✥ 平移</button><button data-tool="rect">矩形</button><button data-tool="ellipse">圆形</button><button data-tool="crop">提取图片</button><button data-tool="trace">局部矢量化</button></div><div class="view-tools"><button id="undo" disabled title="撤销 Ctrl+Z">↶ 撤销</button><button id="redo" disabled title="重做 Ctrl+Shift+Z / Ctrl+Y">↷ 重做</button><select id="view" aria-label="查看方式"><option value="design">拆分结果</option><option value="source">原始图片</option><option value="overlay">原图叠加 50%</option></select><button id="fit">适应</button><select id="zoom" aria-label="缩放"><option value="fit">适应画布</option><option value="0.5">50%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></div></div>
<div id="viewport"><div id="empty"><div class="empty-art"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m4 15 5-5 4 4 3-3 4 4"/><circle cx="15" cy="7" r="1"/></svg></div><div class="empty-label">IMAGE TO DESIGN</div><h1>导入图片</h1><button id="upload-empty" class="primary">选择图片</button><small>Ctrl + 滚轮缩放 · 空格拖动画布</small></div><div id="image-world" hidden><div id="board" hidden></div><textarea id="image-inline-text" aria-label="直接编辑文字" hidden></textarea></div></div><footer><span id="status" role="status" aria-live="polite">等待导入图片</span><span id="dimensions"></span></footer><div id="image-job" hidden><div><span>正在处理图像</span><b id="image-percent">0%</b></div><progress id="progress" max="1" value="0" hidden></progress></div></main>
<aside class="properties"><div class="inspector-tabs"><button id="tab-edit" aria-pressed="true">设计</button><button id="tab-export" aria-pressed="false">导出 ↗</button></div><div id="inspector-edit"><section class="selected-refine-controls" aria-label="所选图层检查"><button id="refine-selected" type="button" class="primary" disabled>检查并修正选中项</button><p id="selected-refine-note" class="tip" role="status" aria-live="polite"></p></section><div id="background-settings"></div><div id="no-selection"><div class="section-title">画板</div><p class="tip"></p><div class="stats"><div><b id="stat-text">—</b><span>文字</span></div><div><b id="stat-vector">—</b><span>形状</span></div><div><b id="stat-raster">—</b><span>图片</span></div></div></div><div id="properties" hidden><section id="recognition-review" hidden><h3>原图文字</h3><canvas id="text-reference"></canvas><p id="replacement-hint"></p><button id="apply-recognized" class="primary">使用文字层</button></section><label>名称<input id="name" maxlength="100"></label><label id="text-label">文字内容<textarea id="text" rows="3"></textarea></label><div class="grid"><label>X<input id="x" type="number" step="1"></label><label>Y<input id="y" type="number" step="1"></label><label>W<input id="width" type="number" min="1"></label><label>H<input id="height" type="number" min="1"></label></div><label id="font-label">字体<input id="fontFamily" list="native-fonts" placeholder="Microsoft YaHei"></label><div class="grid" id="type-props"><label>字号<input id="fontSize" type="number" min="1" max="1000"></label><label>字重<select id="fontWeight"><option value="400">常规</option><option value="500">中等</option><option value="600">半粗</option><option value="700">粗体</option></select></label></div><div id="stroke-props" class="grid"><label>描边颜色<input id="stroke" type="color" value="#161919"></label><label>描边宽度<input id="strokeWidth" type="number" min="0" max="30" step="0.5" value="0"></label></div><div class="grid"><label id="fill-label">填色<input id="fill" type="color"></label><label>不透明度 %<input id="opacity" type="number" min="0" max="100"></label></div><label id="radius-label">圆角<input id="radius" type="number" min="0"></label><div class="grid"><label class="check"><input id="visible" type="checkbox"> 显示</label><label class="check"><input id="locked" type="checkbox"> 锁定</label></div><p id="confidence" class="tip"></p><button id="review">已校对此图层</button></div>

<details><summary>局部矢量化设置</summary><label>描摹颜色数<select id="trace-colors"><option value="2">2 色（单色艺术字）</option><option value="4">4 色</option><option value="8" selected>8 色</option><option value="16">16 色</option></select></label><p class="tip">艺术字转为路径，改字需重新描摹。</p></details>
</div><div id="inspector-export" hidden><p id="pending-export-note" class="recognition-summary" hidden></p><div class="section-title">导出设置</div><div class="image-export-form"><label>范围<select id="image-export-scope"><option value="all">画板</option><option value="selected">所选</option></select></label><label>格式<select id="image-export-format"><option value="png">PNG 图片</option><option value="psd" selected>Photoshop PSD</option><option value="figma">Figma 插件数据</option><option value="svg">SVG 矢量</option><option value="html">HTML 网页</option></select></label><p id="image-export-info" class="tip">导出当前可见图层。</p><button id="image-export-run" class="primary">导出</button></div></div><details><summary>校对提示</summary><p class="tip">普通文字可编辑；艺术字、照片保留素材层。字体、字号和修补背景需校对。</p></details></aside></div>
<script src="layer-style-runtime.js"></script><script src="image-native.js"></script><script src="project-codec.js"></script><script src="app-session.js"></script><script src="store.js"></script><script src="editor-ui.js"></script><script src="smart-split.js"></script><script src="codex-settings.js"></script><script src="image-editor.js"></script><script src="studio-base.js"></script><script src="project-sync.js"></script><script src="project-thumbnail.js"></script><script src="layer-style-panel.js"></script><script src="region-selection.js"></script><script src="studio.js"></script><script src="image-studio.js"></script><script src="workspace-ui.js"></script><script src="workspace-polish.js"></script><datalist id="native-fonts"><option value="Microsoft YaHei"></option><option value="SimHei"></option><option value="Arial"></option><option value="Impact"></option><option value="Arial Narrow"></option><option value="Haettenschweiler"></option></datalist><script src="refinement-versions.js"></script><script src="selected-refine.js"></script><script src="layer-order.js"></script></body></html>
