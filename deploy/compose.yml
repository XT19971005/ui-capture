name: shijie
x-app: &app
  image: ${SHIJIE_IMAGE:-shijie:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      IMAGE_REGISTRY: ${SHIJIE_IMAGE_REGISTRY:-docker.io/library/}
      PIP_INDEX_URL: ${SHIJIE_PIP_INDEX_URL:-https://pypi.org/simple}
  restart: unless-stopped
  init: false
  read_only: true
  user: "${SHIJIE_UID:-10001}:${SHIJIE_GID:-10001}"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=1g,mode=1777"]
  volumes:
    - ${SHIJIE_DATA_DIR:-../.local/data}:/data
    - ${SHIJIE_CONFIG_FILE:-../.local/config.toml}:/run/secrets/config.toml:ro
  depends_on:
    db: {condition: service_healthy}
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}
services:
  db:
    image: ${SHIJIE_IMAGE_REGISTRY:-docker.io/library/}postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: shijie
      POSTGRES_USER: shijie
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres:/var/lib/postgresql/data
      - ${SHIJIE_DB_PASSWORD_FILE:-../.local/postgres-password}:/run/secrets/postgres-password:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shijie -d shijie"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: 2
  web:
    <<: *app
    ports: ["127.0.0.1:${SHIJIE_HTTP_PORT:-8093}:8093"]
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: [CMD, python, /app/tools/healthcheck.py]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [python, manage.py, worker]
    mem_limit: 8g
    cpus: 4
    pids_limit: 512
    stop_grace_period: 30s
volumes:
  postgres:
