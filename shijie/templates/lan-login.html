</style></head><body><main><h1>AI拆图助手</h1><p>使用同事共享的模型服务，输入访问码即可进入。</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="access">局域网访问码</label><input id="access" name="access_code" type="password" autocomplete="off" required maxlength="80" autofocus><button type="submit">进入工作台</button></form><small>工程通过导出／导入保存在自己的电脑，PSD 直接下载。各浏览器的任务独立；共享电脑需保持开机。</small></main></body></html>
