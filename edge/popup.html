<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>拾界</title><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="studio.css"></head><body><header class="popup-header"><a class="brand" href="#"><img class="shijie-mark" src="icons/shijie.svg" alt="拾界图标"><span>拾界<small>UI CAPTURE</small></span></a><span class="version">0.8.1</span></header><main><section id="popup-web" class="capture-card"><h1>抓取网页</h1><p>文字、图片、形状，带入工作台编辑。</p><div class="capture-settings"><div class="scope-buttons" role="group" aria-label="抓取范围"><button data-scope="viewport" aria-pressed="true">当前屏幕</button><button data-scope="page" aria-pressed="false">整页</button><button data-scope="region" aria-pressed="false">框选</button></div><input id="scope" type="hidden" value="viewport"><label class="capture-option"><span>包含网页图片</span><input id="images" type="checkbox" checked><span class="switch" aria-hidden="true"></span></label></div><button id="capture" class="primary capture-action"><span>抓取当前屏幕</span><span>↗</span></button></section><div class="popup-projects"><button id="workbench">继续编辑</button><button id="popup-library">工程库</button></div><progress id="progress" hidden max="1" value="0"></progress><div id="status" role="status" aria-live="polite"></div><details><summary>本地 HTML 无法抓取？</summary><p>在扩展详情中开启「允许访问文件 URL」，再刷新网页。</p></details></main><footer><span class="privacy-dot"></span> 本机处理 <span>Designed by <b>XT</b></span></footer><script src="popup.js"></script></body></html>
