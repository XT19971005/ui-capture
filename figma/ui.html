<!doctype html><html><meta charset="utf-8"><style>body{padding:20px;background:#f5f9fc;color:#233d4d;font:13px sans-serif}h2{font-size:21px}p{line-height:1.7;color:#718491}input{width:100%;margin:15px 0}button{border:0;background:#b4a9f4;padding:13px;border-radius:10px;width:100%;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;line-height:1.7;font-size:12px;margin-top:18px}</style><h2>拾界 · Figma 导入</h2><p>选择 Edge 扩展生成的 JSON 文件。<br>文字、图片与布局将成为可编辑图层。</p><input type="file" id="file" accept=".json,application/json"><button id="import" disabled>导入到当前页面</button><div id="status" role="status">数据仅在本地传递，不上传服务器。</div><script>
let data;const button=document.getElementById('import'),status=document.getElementById('status');document.getElementById('file').onchange=async e=>{button.disabled=true;data=null;try{const file=e.target.files[0];if(!file)return;if(file.size>35000000)throw Error('文件大于 35 MB，请减少抓取范围或关闭图片嵌入');data=JSON.parse(await file.text());if(data.format!=='gugu-page-to-figma'||data.version!==1||!data.root)throw Error('请选择本插件生成的 JSON');status.textContent='准备导入：'+data.title+'\n'+data.count+' 个图层\n'+(data.warnings||[]).join('\n');button.disabled=false}catch(e){status.textContent=e.message}};button.onclick=()=>{button.disabled=true;status.textContent='正在建立图层…';parent.postMessage({pluginMessage:{type:'import',data}},'*')};onmessage=e=>{const message=e.data.pluginMessage;if(!message)return;status.textContent=message.text;if(message.type==='done'||message.type==='error')button.disabled=!data};
</script></html>
