<!doctype html><html><meta charset="utf-8"><style>body{padding:20px;background:#f5f9fc;color:#233d4d;font:13px sans-serif}h2{font-size:21px}p{line-height:1.7;color:#718491}input{width:100%;margin:15px 0}button{border:0;background:#b4a9f4;padding:13px;border-radius:10px;width:100%;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;line-height:1.7;font-size:12px;margin-top:18px}</style><h2>AI拆图助手 · Figma 导入</h2><p>选择 AI拆图助手导出的 .figma.json 或 Figma 数据 JSON。<br>文字、图片与布局将成为可编辑图层。</p><input type="file" id="file" accept=".json,application/json"><button id="import" disabled>导入到当前页面</button><div id="status" role="status">数据仅在本地传递，不上传服务器。</div><script>
let data;const button=document.getElementById('import'),status=document.getElementById('status');document.getElementById('file').onchange=async e=>{button.disabled=true;data=null;try{const file=e.target.files[0];if(!file)return;if(file.size>35000000)throw Error('文件超过35 MB，请返回AI拆图助手改为所选图层导出，分批导入；不要关闭图片嵌入');try{data=JSON.parse(await file.text())}catch{throw Error('文件不是有效JSON，请重新选择AI拆图助手导出的Figma数据文件')};if(!['gugu-page-to-figma','shijie-ui-capture'].includes(data?.format)||data.version!==1||!data.root)throw Error('请选择AI拆图助手导出的Figma数据JSON；工程.scene.json或普通JSON不能在这里导入');status.textContent='准备导入：'+data.title+'\n'+(Number.isFinite(data.count)?data.count+' 个图层':'文字、形状与嵌入图片')+'\n'+(data.warnings||[]).join('\n');button.disabled=false}catch(e){status.textContent=e.message}};button.onclick=()=>{button.disabled=true;status.textContent='正在建立图层…';parent.postMessage({pluginMessage:{type:'import',data}},'*')};onmessage=e=>{const message=e.data.pluginMessage;if(!message)return;status.textContent=message.text;if(message.type==='done'||message.type==='error')button.disabled=!data};
</script></html>
